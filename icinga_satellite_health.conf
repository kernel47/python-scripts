// Installer sur le master uniquement ; adapter le nom du Host et le FQDN TLS.
object CheckCommand "satellite-health" {
    command = [ "/usr/bin/python3", "/etc/icinga2/scripts/icinga_satellite_health.py" ]
    timeout = 60s
    arguments = {
        "--api-url" = "$satellite_health_api_url$"
        "--tcp-timeout" = "$satellite_health_tcp_timeout$"
        "--credentials-file" = "$satellite_health_credentials_file$"
        "--ca-file" = "$satellite_health_ca_file$"
        "--no-tcp" = {
            set_if = "$satellite_health_no_tcp$"
        }
    }
}

apply Service "Satellite Infrastructure" {
    check_command = "satellite-health"
    check_interval = 1m
    retry_interval = 20s
    max_check_attempts = 3
    enable_active_checks = true
    // Le FQDN doit résoudre vers ce master et correspondre au certificat.
    vars.satellite_health_api_url = "https://icinga-master.domain:5665"
    vars.satellite_health_tcp_timeout = 3
    vars.satellite_health_credentials_file = "/etc/icinga2/satellite-health-credentials.json"
    vars.satellite_health_ca_file = "/var/lib/icinga2/certs/ca.crt"
    vars.satellite_health_no_tcp = false
    assign where host.name == "icinga-master"
}

// Exemple : définir un vrai secret avant installation.
object ApiUser "satellite-health" {
    password = "REMPLACER_PAR_UN_SECRET_LONG"
    permissions = [ "objects/query/Endpoint", "objects/query/Zone" ]
}
